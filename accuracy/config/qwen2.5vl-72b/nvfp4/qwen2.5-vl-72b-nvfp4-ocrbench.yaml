seed: 5000
model:
  model_type: Qwen/Qwen2.5-VL-72B-Instruct
save:
  run_dir: save/qwen2.5-vl-72b-nvfp4-ocrbench/
  logger: inference.log
eval:
  benchmarks:
  - ocrbench
quantization:
  vision:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
    quantize_bmm_input: true
    bmm_qtype: nvfp4
    bmm_block_size: 16
  projector:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
  llm:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
    quantize_bmm_input: true
    bmm_qtype: nvfp4
    bmm_block_size: 16
    num_samples: 128
    rescale_out: false
smooth:
  alpha: 0.85
  flag: false
