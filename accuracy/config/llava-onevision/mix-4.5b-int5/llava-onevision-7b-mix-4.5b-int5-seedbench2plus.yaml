seed: 5000
model:
  model_type: llava-hf/llava-onevision-qwen2-7b-ov-hf
save:
  run_dir: save/llava-onevision-7b-mix-4.5b-int5-seedbench2plus/
  logger: inference.log
eval:
  benchmarks:
  - seedbench2plus
quantization:
  vision:
    wbit: 5
    abit: 3
    wqtype: mxint_quant
    xqtype: inverted_mxint_quant
    w_block_size: 32
    a_block_size: 32
    a_ebit: 3
    mantissa_group_size: 8
    shared_exp_bits: 8
    quantize_bmm_input: true
    bmm_qtype: mixed_invmx_mxint
    bmm_bits: 5
    bmm_ebit: 3
    bmm_q_bits: 3
    bmm_q_ebit: 3
    bmm_kv_bits: 5
    bmm_block_size: 32
  projector:
    wbit: 5
    abit: 3
    wqtype: mxint_quant
    xqtype: inverted_mxint_quant
    w_block_size: 32
    a_block_size: 32
    shared_exp_bits: 8
    a_ebit: 3
    mantissa_group_size: 8
  llm:
    wbit: 5
    abit: 3
    wqtype: mxint_quant
    xqtype: inverted_mxint_quant
    w_block_size: 32
    a_block_size: 32
    mantissa_group_size: 8
    quantize_bmm_input: true
    bmm_qtype: mixed_invmx_mxint
    bmm_bits: 5
    bmm_ebit: 3
    bmm_q_bits: 3
    bmm_kv_bits: 5
    bmm_block_size: 32
    num_samples: 128
    rescale_out: false
    shared_exp_bits: 8
    a_ebit: 3
    bmm_q_ebit: 3
smooth:
  alpha: 0.85
  flag: false
