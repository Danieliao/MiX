seed: 5000
model:
  model_type: llava-hf/llava-onevision-qwen2-7b-ov-hf
save:
  run_dir: save/llava-onevision-7b-mxfp4-vizwiz/
  logger: inference.log
eval:
  benchmarks:
  - vizwiz
quantization:
  vision:
    wbit: 4
    abit: 4
    wqtype: mxfp4_ceil_quant
    xqtype: mxfp4_ceil_quant
    w_block_size: 32
    a_block_size: 32
    quantize_bmm_input: true
    bmm_qtype: mxfp4_ceil
    bmm_block_size: 32
  projector:
    wbit: 4
    abit: 4
    wqtype: mxfp4_ceil_quant
    xqtype: mxfp4_ceil_quant
    w_block_size: 32
    a_block_size: 32
  llm:
    wbit: 4
    abit: 4
    wqtype: mxfp4_ceil_quant
    xqtype: mxfp4_ceil_quant
    w_block_size: 32
    a_block_size: 32
    quantize_bmm_input: true
    bmm_qtype: mxfp4_ceil
    bmm_block_size: 32
    num_samples: 128
    rescale_out: false
smooth:
  alpha: 0.85
  flag: false
