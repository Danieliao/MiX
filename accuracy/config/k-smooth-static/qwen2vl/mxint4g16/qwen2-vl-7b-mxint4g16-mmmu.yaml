seed: 5000
model:
  model_type: Qwen/Qwen2-VL-7B-Instruct
save:
  run_dir: save/k-smooth-static/qwen2vl/mxint4g16/qwen2-vl-7b-mxint4g16-mmmu/
  logger: inference.log
eval:
  benchmarks:
  - mmmu
quantization:
  vision:
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 16
    a_block_size: 16
    shared_exp_bits: 8
    quantize_bmm_input: true
    bmm_qtype: mxint
    bmm_bits: 4
    bmm_block_size: 16
  projector:
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 16
    a_block_size: 16
    shared_exp_bits: 8
  llm:
    k_smooth_static: true   # freeze prefill K-mean (hardware-efficient K-smoothing)
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 16
    a_block_size: 16
    shared_exp_bits: 8
    quantize_bmm_input: true
    bmm_qtype: mxint
    bmm_bits: 4
    bmm_block_size: 16
    num_samples: 128
    rescale_out: false
smooth:
  alpha: 0.85
  flag: false
