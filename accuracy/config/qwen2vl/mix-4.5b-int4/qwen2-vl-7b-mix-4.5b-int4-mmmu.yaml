seed: 5000
model:
  model_type: Qwen/Qwen2-VL-7B-Instruct
save:
  run_dir: save/qwen2-vl-7b-mix-4.5b-int4-mmmu/
  logger: inference.log
eval:
  benchmarks:
  - mmmu
quantization:
  vision:
    wbit: 4
    abit: 3
    wqtype: mxint_quant
    xqtype: inverted_mxint_quant
    w_block_size: 16
    a_block_size: 32
    shared_exp_bits: 8
    a_ebit: 3
    mantissa_group_size: 8
    quantize_bmm_input: true
    bmm_qtype: mixed_invmx_mxint
    bmm_bits: 4
    bmm_ebit: 3
    bmm_q_bits: 3
    bmm_q_ebit: 3
    bmm_kv_bits: 4
    bmm_q_block_size: 32
    bmm_kv_block_size: 16
  projector:
    wbit: 3
    abit: 4
    wqtype: inverted_mxint_quant
    xqtype: mxint_quant
    w_block_size: 32
    a_block_size: 16
    shared_exp_bits: 8
    w_ebit: 3
    mantissa_group_size: 8
  llm:
    wbit: 4
    abit: 3
    wqtype: mxint_quant
    xqtype: inverted_mxint_quant
    w_block_size: 16
    a_block_size: 32
    shared_exp_bits: 8
    mantissa_group_size: 8
    quantize_bmm_input: true
    bmm_qtype: mixed_invmx_mxint
    bmm_bits: 4
    bmm_ebit: 3
    bmm_q_bits: 3
    bmm_kv_bits: 4
    num_samples: 128
    rescale_out: false
    a_ebit: 3
    bmm_q_ebit: 3
    bmm_kv_block_size: 16
    bmm_q_block_size: 32
smooth:
  alpha: 0.85
  flag: false
