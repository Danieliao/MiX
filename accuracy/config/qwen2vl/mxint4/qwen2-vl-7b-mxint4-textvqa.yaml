seed: 5000
model:
  model_type: Qwen/Qwen2-VL-7B-Instruct
save:
  run_dir: save/qwen2-vl-7b-mxint4-textvqa/
  logger: inference.log
eval:
  benchmarks:
  - textvqa
quantization:
  vision:
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 32
    a_block_size: 32
    shared_exp_bits: 8
    quantize_bmm_input: true
    bmm_qtype: mxint
    bmm_bits: 4
    bmm_block_size: 32
  projector:
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 32
    a_block_size: 32
    shared_exp_bits: 8
  llm:
    wbit: 4
    abit: 4
    wqtype: mxint_quant
    xqtype: mxint_quant
    w_block_size: 32
    a_block_size: 32
    shared_exp_bits: 8
    quantize_bmm_input: true
    bmm_qtype: mxint
    bmm_bits: 4
    bmm_block_size: 32
    num_samples: 128
    rescale_out: false
smooth:
  alpha: 0.85
  flag: false
