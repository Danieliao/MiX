seed: 5000
model:
  model_type: Qwen/Qwen2-VL-7B-Instruct
save:
  run_dir: save/qwen2-vl-7b-nvfp4-textvqa/
  logger: inference.log
eval:
  benchmarks:
  - textvqa
quantization:
  vision:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
    quantize_bmm_input: true
    bmm_qtype: nvfp4
    bmm_block_size: 16
  projector:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
  llm:
    wbit: 4
    abit: 4
    wqtype: nvfp4_quant
    xqtype: nvfp4_quant
    w_block_size: 16
    a_block_size: 16
    quantize_bmm_input: true
    bmm_qtype: nvfp4
    bmm_block_size: 16
    num_samples: 128
    rescale_out: false
smooth:
  alpha: 0.85
  flag: false
